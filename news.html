<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Vinyl — Новости</title>
  <link rel="stylesheet" href="css/market.css" />
  <style>
    /* Дополнительные стили для страницы новостей */
    .news-hero {
      text-align: center;
      padding: 60px 20px 30px;
    }
    .news-hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      background: linear-gradient(45deg, #2AB0FF, #B023FF, #FF4C8B);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 20px;
    }
    .news-filters {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin: 30px 0 20px;
    }
    .news-filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(160, 52, 255, 0.3);
      color: #d9d4ff;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .news-filter-btn:hover,
    .news-filter-btn.active {
      background: linear-gradient(135deg, #1FA4FF, #B023FF);
      color: white;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(31, 164, 255, 0.3);
    }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
      max-width: 1400px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .news-card {
      background: rgba(18, 18, 30, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(160, 52, 255, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.5s ease forwards;
      opacity: 0;
    }
    .news-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(160, 52, 255, 0.3);
    }
    .news-card-image {
      height: 200px;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .news-card-image::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.7));
    }
    .news-card-category {
      position: absolute;
      top: 15px;
      right: 15px;
      background: linear-gradient(135deg, #FF4C8B, #B023FF);
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(255, 76, 139, 0.3);
    }
    .news-card-content {
      padding: 25px;
    }
    .news-date {
      color: #3ED6FF;
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .news-title {
      font-size: 20px;
      font-weight: 700;
      color: white;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .news-excerpt {
      color: #b0b0d0;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .news-read-more {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #00ff9d;
      text-decoration: none;
      font-weight: 600;
      transition: gap 0.3s ease;
    }
    .news-read-more:hover {
      gap: 12px;
      color: #FF4C8B;
    }
    .load-more-news {
      text-align: center;
      margin: 60px 0 80px;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      .news-hero h1 { font-size: 36px; }
      .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header neon-header">
      <div class="container">

    </div>

    <div class="header-main neon-main">
      <div class="container">
        <div class="header-logo">
          <a href="index.html" class="logo-link neon-logo">
            <span class="logo-text">Vinyl<span class="logo-highlight neon-glow">Neon</span></span>
          </a>
        </div>
        <nav class="header-nav neon-nav">
          <ul class="nav-list neon-nav-list">
            <li class="nav-item neon-nav-item">
              <a href="index.html" class="nav-link neon-nav-link">Главная</a>
            </li>
            <li class="nav-item neon-nav-item">
              <a href="market.html" class="nav-link neon-nav-link">Магазин</a>
            </li>
            <li class="nav-item neon-nav-item">
              <a href="news.html" class="nav-link neon-nav-link active">Новости</a>
            </li>
            <li class="nav-item neon-nav-item">
              <a href="contacts.html" class="nav-link neon-nav-link ">Контакты</a>
            </li>
          </ul>
        </nav>
        <div class="header-actions neon-actions">
          <!-- Корзина -->
          <a href="#" class="cart-btn neon-btn" aria-label="Корзина" id="cartBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00ff9d">
              <circle cx="9" cy="21" r="1"/>
              <circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="cart-count neon-count" id="cartCount">0</span>
          </a>
          <!-- Избранное -->
          <button class="favorite-btn neon-btn" aria-label="Избранное" id="favoritesBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff00ff">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span class="favorite-count neon-count" id="favoriteCount">0</span>
          </button>
          <!-- Пользователь -->
          <div class="user-section">
            <button class="user-btn neon-btn" id="header-button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00b3ff">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span id="auth-text">Войти</span>
            </button>
            <div class="user-dropdown" id="userDropdown" style="display: none;">
              <!-- ... содержимое ... -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <section class="news-hero">
    <h1>Новости и события</h1>
    <p>Будьте в курсе последних релизов, акций и мероприятий</p>
  </section>

  <div class="news-filters" id="newsFilters">
    <button class="news-filter-btn active" data-filter="all">Все</button>
    <button class="news-filter-btn" data-filter="release">Релизы</button>
    <button class="news-filter-btn" data-filter="event">События</button>
    <button class="news-filter-btn" data-filter="sale">Акции</button>
  </div>

  <div class="news-grid" id="newsGrid"></div>

  <div class="load-more-news">
    <button class="load-more-btn" id="loadMoreNews">Загрузить ещё новости</button>
  </div>

  <!-- ПОДВАЛ -->
  <footer>© 2025 Neon Vinyl — музыка будущего в неоновых тонах</footer>

  <!-- МОДАЛЬНЫЕ ОКНА (копия из index.html) -->
  <div class="auth-modal" id="loginModal">...</div>
  <div class="auth-modal" id="registerModal">...</div>
  <div class="cart-modal" id="cartModal">...</div>
  <div class="favorites-modal" id="favoritesModal">...</div>
  <div class="details-modal" id="detailsModal">...</div>

  <!-- Уведомления -->
  <div class="notification-container" id="notificationContainer"></div>

  <script src="js/auth-fixed.js"></script>
  <script>
    // Данные новостей
    const newsData = [
      {
        id: 1,
        title: "Новый альбом M83 «Midnight City» уже в продаже",
        date: "2025-02-28",
        category: "release",
        excerpt: "Долгожданный альбом с эксклюзивным виниловым изданием. В комплекте постер и нашивка.",
        image: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        link: "#"
      },
      {
        id: 2,
        title: "Фестиваль Neon Nights в Калининграде",
        date: "2025-03-15",
        category: "event",
        excerpt: "12 марта в клубе «Плазма» пройдёт фестиваль электронной музыки. Хедлайнеры: The Weeknd, Dua Lipa.",
        image: "https://images.unsplash.com/photo-1511379938547-c1f69419868d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        link: "#"
      },
      {
        id: 3,
        title: "Скидка 20% на весь синтвейв",
        date: "2025-02-20",
        category: "sale",
        excerpt: "Только до конца месяца: всё синтвейв-издание со скидкой 20%. Успейте пополнить коллекцию!",
        image: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        link: "#"
      },
      {
        id: 4,
        title: "Встреча с исполнителем Kavinsky",
        date: "2025-04-05",
        category: "event",
        excerpt: "Автосессия и автограф-сессия в нашем магазине. Приходите за эксклюзивным мерчем!",
        image: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        link: "#"
      },
      {
        id: 5,
        title: "Пластинка «Blinding Lights» — лимитированное издание",
        date: "2025-03-01",
        category: "release",
        excerpt: "Цветной винил с альтернативной обложкой. Тираж всего 500 экземпляров.",
        image: "https://images.unsplash.com/photo-1511379938547-c1f69419868d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        link: "#"
      }
    ];

    let currentFilter = 'all';
    let visibleCount = 3;
    const newsGrid = document.getElementById('newsGrid');
    const loadMoreBtn = document.getElementById('loadMoreNews');
    const filterBtns = document.querySelectorAll('.news-filter-btn');

    function renderNews() {
      const filtered = currentFilter === 'all' 
        ? newsData 
        : newsData.filter(item => item.category === currentFilter);
      
      const toShow = filtered.slice(0, visibleCount);
      newsGrid.innerHTML = toShow.map((item, idx) => `
        <article class="news-card" style="animation-delay: ${idx * 0.1}s">
          <div class="news-card-image" style="background-image: url('${item.image}')">
            <span class="news-card-category">${getCategoryName(item.category)}</span>
          </div>
          <div class="news-card-content">
            <div class="news-date">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3ED6FF">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              ${formatDate(item.date)}
            </div>
            <h3 class="news-title">${item.title}</h3>
            <p class="news-excerpt">${item.excerpt}</p>
            <a href="${item.link}" class="news-read-more">
              Читать далее
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </a>
          </div>
        </article>
      `).join('');

      // Показать/скрыть кнопку "Загрузить ещё"
      loadMoreBtn.style.display = visibleCount >= filtered.length ? 'none' : 'inline-block';
    }

    function getCategoryName(cat) {
      const map = { release: 'Релиз', event: 'Событие', sale: 'Акция' };
      return map[cat] || cat;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        visibleCount = 3;
        renderNews();
      });
    });

    loadMoreBtn.addEventListener('click', () => {
      visibleCount += 3;
      renderNews();
    });

    // Инициализация
    renderNews();
  </script>
</body>
</html>
